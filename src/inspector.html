<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Inspetor de Conteúdos</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Segoe UI", sans-serif; background: #f3f4f6; color: #222; font-size: 14px; }

header { background: #fff; border-bottom: 1px solid #e5e7eb; padding: 16px 28px; display: flex; align-items: center; gap: 12px; }
header h1 { font-size: 17px; font-weight: 600; }
header span { font-size: 12px; background: #fef3c7; color: #92400e; padding: 3px 10px; border-radius: 99px; }

.toolbar { background: #fff; border-bottom: 1px solid #e5e7eb; padding: 14px 28px; display: flex; gap: 10px; align-items: center; }
.toolbar input { flex: 1; padding: 9px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; }
.toolbar input:focus { outline: none; border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }
.toolbar button { padding: 9px 18px; border-radius: 8px; border: none; background: #6366f1; color: #fff; font-size: 14px; font-weight: 500; cursor: pointer; white-space: nowrap; }
.toolbar button:hover { background: #4f46e5; }
.toolbar button.sec { background: #f3f4f6; color: #374151; border: 1px solid #d1d5db; }
.toolbar button.sec:hover { background: #e5e7eb; }

.status-bar { padding: 8px 28px; font-size: 12px; color: #6b7280; border-bottom: 1px solid #e5e7eb; background: #fafafa; min-height: 34px; display: flex; align-items: center; gap: 8px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #d1d5db; flex-shrink: 0; }
.dot.ok { background: #10b981; }
.dot.err { background: #ef4444; }
.dot.loading { background: #f59e0b; animation: pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

.layout { display: flex; height: calc(100vh - 130px); overflow: hidden; }

.sidebar { width: 280px; flex-shrink: 0; overflow-y: auto; border-right: 1px solid #e5e7eb; background: #fff; }
.sidebar-header { padding: 12px 16px; font-size: 11px; font-weight: 600; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid #f3f4f6; }

.content-item { display: flex; align-items: center; gap: 10px; padding: 10px 16px; cursor: pointer; border-bottom: 0.5px solid #f3f4f6; transition: background 0.1s; }
.content-item:hover { background: #f9fafb; }
.content-item.active { background: #eef2ff; }
.item-thumb { width: 44px; height: 44px; border-radius: 6px; object-fit: cover; background: #f3f4f6; flex-shrink: 0; }
.item-info { flex: 1; overflow: hidden; }
.item-info .id { font-size: 12px; font-weight: 500; color: #374151; font-family: monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item-info .sub { font-size: 11px; color: #9ca3af; margin-top: 2px; }
.badge { font-size: 10px; padding: 2px 7px; border-radius: 99px; flex-shrink: 0; font-weight: 500; }
.badge.ok { background: #d1fae5; color: #065f46; }
.badge.err { background: #fee2e2; color: #991b1b; }
.badge.warn { background: #fef3c7; color: #92400e; }
.badge.pend { background: #f3f4f6; color: #6b7280; }

.main { flex: 1; overflow-y: auto; padding: 24px 28px; }
.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #9ca3af; gap: 10px; }
.empty-state svg { opacity: 0.3; }

.detail-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; color: #111; display: flex; align-items: center; gap: 8px; }
.detail-title code { font-size: 13px; background: #f3f4f6; padding: 2px 8px; border-radius: 4px; color: #6366f1; }

.section { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; margin-bottom: 16px; overflow: hidden; }
.section-head { padding: 12px 18px; font-size: 12px; font-weight: 600; color: #6b7280; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid #f3f4f6; background: #fafafa; display: flex; align-items: center; justify-content: space-between; }
.section-body { padding: 16px 18px; }

.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 20px; }
.field label { display: block; font-size: 11px; color: #9ca3af; margin-bottom: 3px; }
.field .val { font-size: 13px; font-weight: 500; word-break: break-all; }
.val.ok { color: #059669; }
.val.err { color: #dc2626; }
.val.warn { color: #d97706; }
.val.neu { color: #374151; }

.img-row { display: flex; gap: 12px; flex-wrap: wrap; }
.img-card { border: 1px solid #e5e7eb; border-radius: 8px; overflow: hidden; }
.img-card img { width: 160px; height: 100px; object-fit: cover; display: block; background: #f3f4f6; }
.img-card p { font-size: 11px; color: #6b7280; padding: 5px 8px; }

.log-box { font-family: monospace; font-size: 12px; background: #1e1e2e; color: #cdd6f4; padding: 12px 16px; border-radius: 8px; white-space: pre-wrap; max-height: 180px; overflow-y: auto; line-height: 1.6; }
.log-ok { color: #a6e3a1; }
.log-err { color: #f38ba8; }
.log-warn { color: #fab387; }

.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-row a { padding: 8px 14px; border-radius: 8px; border: 1px solid #d1d5db; background: #fff; color: #374151; font-size: 13px; text-decoration: none; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
.btn-row a:hover { background: #f9fafb; border-color: #9ca3af; }

.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #e5e7eb; border-top-color: #6366f1; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <h1>🔍 Inspetor de Conteúdos</h1>
  <span>Debug Tool</span>
</header>

<div class="toolbar">
  <input type="text" id="base-url" value="http://localhost:5000" placeholder="URL base (ex: http://localhost:5000)" />
  <button onclick="loadContents()">▶ Carregar</button>
  <button class="sec" onclick="clearAll()">Limpar</button>
</div>

<div class="status-bar">
  <div class="dot" id="dot"></div>
  <span id="status-msg">Configure a URL e clique em Carregar.</span>
</div>

<div class="layout">
  <div class="sidebar">
    <div class="sidebar-header">Conteúdos <span id="count" style="font-weight:400;"></span></div>
    <div id="list"></div>
  </div>
  <div class="main" id="main">
    <div class="empty-state">
      <svg width="48" height="48" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
      <p>Carregue os conteúdos e clique em um para inspecionar</p>
    </div>
  </div>
</div>

<script>
let items = [];
let logs = {};

function setStatus(msg, state) {
  document.getElementById('status-msg').textContent = msg;
  const d = document.getElementById('dot');
  d.className = 'dot' + (state ? ' ' + state : '');
}

function clearAll() {
  items = []; logs = {};
  document.getElementById('list').innerHTML = '';
  document.getElementById('count').textContent = '';
  document.getElementById('main').innerHTML = '<div class="empty-state"><p>Limpo.</p></div>';
  setStatus('Pronto.');
}

async function loadContents() {
  const base = document.getElementById('base-url').value.trim().replace(/\/$/, '');
  setStatus('Conectando ao servidor...', 'loading');
  document.getElementById('list').innerHTML = '';
  document.getElementById('main').innerHTML = '<div class="empty-state"><span class="spinner"></span>Carregando...</div>';

  try {
    const r = await fetch(base + '/contents', { credentials: 'include' });
    if (!r.ok) { setStatus('Servidor retornou HTTP ' + r.status, 'err'); return; }
    const html = await r.text();
    const doc = new DOMParser().parseFromString(html, 'text/html');

    // Extrai IDs dos botões "Ver"
    const ids = new Set();
    doc.querySelectorAll('button[onclick]').forEach(btn => {
      const m = btn.getAttribute('onclick').match(/content_id=([a-f0-9\-]{10,})/i);
      if (m) ids.add(m[1]);
    });
    // Fallback: links com /content/<id>
    doc.querySelectorAll('a[href]').forEach(a => {
      const m = a.getAttribute('href').match(/\/content[s]?\/content\/([a-f0-9\-]{10,})/i);
      if (m) ids.add(m[1]);
    });

    if (ids.size === 0) {
      setStatus('Nenhum conteúdo encontrado. Você está logado?', 'err');
      document.getElementById('main').innerHTML = '<div class="empty-state"><p>Nenhum conteúdo detectado na página /contents.<br>Verifique se você está logado na app.</p></div>';
      return;
    }

    items = [...ids].map(id => ({ id, base, status: 'pend' }));
    renderList();
    document.getElementById('count').textContent = '— ' + items.length;
    setStatus(items.length + ' conteúdo(s) encontrado(s). Clique para inspecionar.', 'ok');
    document.getElementById('main').innerHTML = '<div class="empty-state"><p>Clique em um conteúdo na lista para inspecionar.</p></div>';
  } catch(e) {
    setStatus('Erro: ' + e.message + ' — verifique se o servidor está rodando e se você está logado.', 'err');
    document.getElementById('main').innerHTML = '<div class="empty-state"><p>Falha ao conectar.<br><small>' + e.message + '</small></p></div>';
  }
}

function renderList() {
  const list = document.getElementById('list');
  list.innerHTML = '';
  items.forEach(item => {
    const el = document.createElement('div');
    el.className = 'content-item';
    el.id = 'item-' + item.id;
    const badgeClass = item.status === 'ok' ? 'ok' : item.status === 'err' ? 'err' : item.status === 'warn' ? 'warn' : 'pend';
    const badgeText = item.status === 'pend' ? '—' : item.status;
    el.innerHTML = `
      <img class="item-thumb" src="${item.base}/contents/banner/${item.id}" onerror="this.style.opacity='0.3'" />
      <div class="item-info">
        <div class="id">${item.id.substring(0,18)}…</div>
        <div class="sub">${item.title || 'clique para inspecionar'}</div>
      </div>
      <span class="badge ${badgeClass}" id="badge-${item.id}">${badgeText}</span>`;
    el.onclick = () => inspect(item.id, item.base);
    list.appendChild(el);
  });
}

async function inspect(id, base) {
  document.querySelectorAll('.content-item').forEach(el => el.classList.remove('active'));
  const itemEl = document.getElementById('item-' + id);
  if (itemEl) itemEl.classList.add('active');
  setStatus('Inspecionando ' + id + '…', 'loading');

  const main = document.getElementById('main');
  main.innerHTML = `<div class="empty-state"><span class="spinner"></span>Verificando rotas...</div>`;

  const log = [];
  const fields = {};
  let overallStatus = 'ok';

  function addField(key, val, cls) {
    fields[key] = { val, cls };
    if (cls === 'err') overallStatus = 'err';
    else if (cls === 'warn' && overallStatus !== 'err') overallStatus = 'warn';
  }

  // 1. Content view
  try {
    const r = await fetch(`${base}/contents/content/${id}`, { credentials: 'include' });
    const ok = r.ok;
    addField('content view (HTTP)', String(r.status), ok ? 'ok' : 'err');
    log.push(`<span class="${ok?'log-ok':'log-err'}">[GET /contents/content/${id}] → ${r.status}</span>`);
    if (ok) {
      const html = await r.text();
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const titleEl = doc.querySelector('h1, h2, .course h3, [class*="title"]');
      const titleText = titleEl ? titleEl.textContent.trim().substring(0,60) : null;
      addField('título na página', titleText || '(não detectado)', titleText ? 'ok' : 'warn');
      const hasPdf = /embed|iframe|\.pdf|pdf_to_html|html_body/i.test(html);
      addField('PDF/HTML renderizado', hasPdf ? 'sim' : 'não detectado', hasPdf ? 'ok' : 'warn');
      log.push(`<span class="log-ok">[content view] título: "${titleText || 'n/a'}" | pdf: ${hasPdf}</span>`);
      // Salva título no item
      const itemObj = items.find(i => i.id === id);
      if (itemObj && titleText) { itemObj.title = titleText; renderList(); document.getElementById('item-' + id).classList.add('active'); }
    }
  } catch(e) {
    addField('content view', 'erro: ' + e.message, 'err');
    log.push(`<span class="log-err">[content view] ERRO: ${e.message}</span>`);
  }

  // 2. PDF
  try {
    const r = await fetch(`${base}/contents/view/${id}`, { credentials: 'include' });
    const ct = r.headers.get('content-type') || '(sem content-type)';
    const ok = r.ok && ct.includes('pdf');
    addField('PDF (HTTP)', String(r.status), r.ok ? 'ok' : 'err');
    addField('PDF content-type', ct, ok ? 'ok' : 'warn');
    log.push(`<span class="${r.ok?'log-ok':'log-err'}">[GET /contents/view/${id}] → ${r.status} | ${ct}</span>`);
    if (r.ok) {
      const blob = await r.blob();
      const kb = (blob.size / 1024).toFixed(1);
      addField('tamanho PDF', kb + ' KB', blob.size > 500 ? 'ok' : 'warn');
      log.push(`<span class="log-ok">[pdf] tamanho: ${kb} KB</span>`);
    }
  } catch(e) {
    addField('PDF', 'erro: ' + e.message, 'err');
    log.push(`<span class="log-err">[pdf] ERRO: ${e.message}</span>`);
  }

  // 3. Banner
  try {
    const r = await fetch(`${base}/contents/banner/${id}`, { credentials: 'include' });
    const ct = r.headers.get('content-type') || '(sem content-type)';
    const ok = r.ok && ct.startsWith('image/');
    addField('banner (HTTP)', String(r.status), r.ok ? 'ok' : 'err');
    addField('banner content-type', ct, ok ? 'ok' : r.ok ? 'warn' : 'err');
    log.push(`<span class="${ok?'log-ok':r.ok?'log-warn':'log-err'}">[GET /contents/banner/${id}] → ${r.status} | ${ct}</span>`);
    if (r.ok) {
      const blob = await r.blob();
      const kb = (blob.size / 1024).toFixed(1);
      addField('tamanho banner', kb + ' KB', blob.size > 100 ? 'ok' : 'warn');
      log.push(`<span class="log-ok">[banner] tamanho: ${kb} KB</span>`);
    }
  } catch(e) {
    addField('banner', 'erro: ' + e.message, 'err');
    log.push(`<span class="log-err">[banner] ERRO: ${e.message}</span>`);
  }

  // Update badge
  const badge = document.getElementById('badge-' + id);
  if (badge) { badge.className = 'badge ' + overallStatus; badge.textContent = overallStatus; }
  const itemObj = items.find(i => i.id === id);
  if (itemObj) itemObj.status = overallStatus;

  logs[id] = log;

  // Render detail
  main.innerHTML = `
    <div class="detail-title">Conteúdo <code>${id.substring(0,8)}…</code>
      <span class="badge ${overallStatus}" style="font-size:12px;">${overallStatus}</span>
    </div>

    <div class="section">
      <div class="section-head">Campos verificados</div>
      <div class="section-body">
        <div class="fields">
          ${Object.entries(fields).map(([k,v]) => `
            <div class="field">
              <label>${k}</label>
              <div class="val ${v.cls}">${v.val}</div>
            </div>`).join('')}
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-head">Banner visual</div>
      <div class="section-body">
        <div class="img-row">
          <div class="img-card">
            <img src="${base}/contents/banner/${id}" onerror="this.alt='⚠ não carregou'; this.style.opacity='0.3'; this.parentElement.querySelector('p').style.color='#dc2626';" />
            <p>/contents/banner/${id}</p>
          </div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-head">Abrir no browser</div>
      <div class="section-body">
        <div class="btn-row">
          <a href="${base}/contents/content/${id}" target="_blank">🔗 View da página</a>
          <a href="${base}/contents/view/${id}" target="_blank">📄 PDF direto</a>
          <a href="${base}/contents/banner/${id}" target="_blank">🖼 Banner direto</a>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-head">Log HTTP <button onclick="toggleLog()" style="font-size:11px; padding:2px 8px; border-radius:4px; border:1px solid #d1d5db; background:#fff; cursor:pointer;">mostrar/ocultar</button></div>
      <div class="section-body">
        <div class="log-box" id="log-box" style="display:none;">${log.join('\n')}</div>
      </div>
    </div>
  `;

  setStatus('Inspeção concluída para ' + id, 'ok');
}

function toggleLog() {
  const l = document.getElementById('log-box');
  l.style.display = l.style.display === 'none' ? 'block' : 'none';
}
</script>
</body>
</html>
