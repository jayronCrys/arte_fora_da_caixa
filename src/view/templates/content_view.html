<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>{{ content.title or "Conteúdo" }}</title>

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Roboto, sans-serif;
      background: #f3f4f6;
      color: #333;
    }

    /* Header estilo site */
    header {
      background: #ffffff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header h1 {
      font-size: 22px;
      color: #222;
      margin: 0;
    }

    header a {
      font-size: 14px;
      text-decoration: none;
      background: linear-gradient(90deg, #ff7a00, #00c853);
      padding: 8px 16px;
      border-radius: 10px;
      color: white;
      font-weight: bold;
      transition: 0.2s;
    }

    header a:hover {
      opacity: 0.9;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      background: white;
      border-radius: 18px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    .content-header {
      padding: 25px 30px;
      border-bottom: 1px solid #eee;
    }

    .content-header h2 {
      margin: 0 0 8px 0;
      font-size: 24px;
      color: #222;
    }

    .content-meta {
      font-size: 14px;
      color: #555;
    }

    .actions {
      margin-top: 15px;
    }

    .actions a {
      display: inline-block;
      margin-right: 12px;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 14px;
      text-decoration: none;
      background: linear-gradient(90deg, #ff7a00, #00c853);
      color: white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      transition: 0.2s;
    }

    .actions a:hover {
      transform: translateY(-2px);
      opacity: 0.9;
      box-shadow: 0 5px 14px rgba(0,0,0,0.2);
    }

    .iframe-wrap {
      width: 100%;
      height: 80vh;
      background: #000;
    }

    object, iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .fallback {
      padding: 20px;
      text-align: center;
      font-size: 15px;
      color: #fff;
    }

    .fallback a {
      color: #ffeb3b;
      text-decoration: underline;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header>
    <h1>Arte Fora da Caixa</h1>
    <a href="/contents">Voltar para conteúdos</a>
  </header>

  <div class="container">

    <div class="content-header">
      <h2>{{ content.title }}</h2>
      <div class="content-meta">Autor: {{ content.author }} — Publicado: {{ content.creation_date }}</div>
      <div class="actions">
      <a href="/contents/view/{{ content.id }}?v={{ content.update_time }}">Abrir em nova aba</a>
      </div>
    </div>

    <div class="iframe-wrap">
      <object data="{{ url_for('get_file', content_id=content.id) }}" type="application/pdf">
        <div class="fallback">
          Seu navegador não consegue exibir PDFs inline. 
          <a href="{{ url_for('get_file', content_id=content.id) }}" target="_blank">Abrir / Baixar PDF</a>.
        </div>
        <iframe src="{{ url_for('get_file', content_id=content.id) }}"></iframe>
      </object>
    </div>

  </div>

</body>
</html>
