<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Criar Conta</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(120deg, #5a52ff, #8e8eff);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
        }
        form {
            background: rgba(0, 0, 0, 0.3);
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            width: 300px;
        }
        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
        }
        button {
            background: #4e46e5;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
        }
        button:hover { background: #423bbf; }
        a {
            color: white;
            text-decoration: none;
            display: block;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <form method="POST" action="/create_account">
        <h2>Criar Conta</h2>
        <input type="text" name="name" placeholder="Nome" required>
        <input type="password" name="password_1" placeholder="Senha" required>
        <input type="password" name="password_2" placeholder="confirmae senga" required>
        <button type="submit">Criar</button>
        <a href="/login">Voltar</a>
    </form>
</body>
</html>
