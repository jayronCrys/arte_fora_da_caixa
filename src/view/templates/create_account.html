<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Criar Conta</title>
    <style>
        body {
            background: #f3f4f6;
            font-family: "Segoe UI", Roboto, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }

        form {
            background: white;
            padding: 40px 35px;
            border-radius: 18px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.08);
            text-align: center;
            width: 320px;
        }

        h2 {
            margin-bottom: 25px;
            color: #222;
            font-size: 24px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border-radius: 10px;
            border: 1px solid #ccc;
            background: #fafafa;
            font-size: 14px;
        }

        /* Botão Criar */
        button {
            width: 100%;
            padding: 12px 0;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #ff7a00, #00c853);
            color: white;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            transition: 0.2s ease-in-out;
            margin-bottom: 12px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 14px rgba(0,0,0,0.2);
        }

        /* Botão Voltar — mesmo estilo do Criar Conta do login */
        .back-btn {
            display: inline-block;
            width: 100%;
            padding: 12px 0;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            background: linear-gradient(90deg, #f39c12, #e67e22); /* mesma coloração */
            color: white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            transition: 0.2s ease-in-out;
            text-align: center;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            opacity: 0.9;
            box-shadow: 0 5px 14px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <form method="POST" action="/create_account">
        <h2>Criar Conta</h2>
        <input type="text" name="name" placeholder="Nome" required>
        <input type="password" name="password_1" placeholder="Senha" required>
        <input type="password" name="password_2" placeholder="Confirmar senha" required>
        <button type="submit">Criar</button>
        <a href="/login" class="back-btn">Voltar</a>
    </form>
</body>
</html>
