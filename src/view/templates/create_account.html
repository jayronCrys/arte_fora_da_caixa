<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Criar Conta - Arte Fora da Caixa</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}"> 

    <style>
        /* Ajustes específicos de alinhamento e largura para a página de Registro */
        body {
            justify-content: center;
            align-items: center;
        }
        
        .register-wrapper {
            width: 100%;
            /* Aumentado para 550px para o formulário ocupar mais espaço na tela */
            max-width: 550px; 
            padding: 20px;
        }

        .error-message {
            background: #fff0f0;
            color: var(--red);
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid rgba(230, 57, 70, 0.15);
        }

        /* ── Modificações Olhinho de Senha ── */
        .password-container {
            position: relative;
            display: flex;
            align-items: center;
        }
        .toggle-password {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 14px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="register-wrapper">
        <div class="panel-box" style="margin: 0;">
            <h2 class="text-center" style="margin-bottom: 24px;">Criar Conta</h2>

            {% if error %}
                <div class="error-message">{{ error }}</div>
            {% endif %}

            <form method="POST" action="/create_account">
               <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-field">
                    <label class="form-label">Nome</label>
                    <input type="text" name="name" class="form-input" placeholder="Digite seu nome" required>
                </div>

                <div class="form-field">
                    <label class="form-label">Senha</label>
                    <div class="password-container">
                        <input type="password" name="password_1" id="password_1" class="form-input" placeholder="Digite sua senha" required>
                        <button type="button" class="toggle-password" onclick="togglePassword('password_1')">👁️</button>
                    </div>
                </div>

                <div class="form-field" style="margin-bottom: 28px;">
                    <label class="form-label">Confirmar Senha</label>
                    <div class="password-container">
                        <input type="password" name="password_2" id="password_2" class="form-input" placeholder="Confirme sua senha" required>
                        <button type="button" class="toggle-password" onclick="togglePassword('password_2')">👁️</button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-bottom: 12px;">
                    Criar
                </button>
                
                <a href="/login" class="btn btn-outline btn-block btn-lg" style="justify-content: center;">
                    Voltar
                </a>
            </form>
        </div>
    </div>

<script>
    window.getCSRFToken = function () {
        return document.querySelector('meta[name="csrf-token"]').getAttribute('content');
    };

    (function () {
        const originalFetch = window.fetch;
        window.fetch = function (resource, options = {}) {
            const method = (options.method || 'GET').toUpperCase();
            const isStateChanging = ['POST', 'PUT', 'PATCH', 'DELETE'].includes(method);
            const url = typeof resource === 'string' ? resource : resource.url;
            const isSameOrigin = url.startsWith('/') || url.startsWith(window.location.origin);

            if (isStateChanging && isSameOrigin) {
                options.headers = { ...(options.headers || {}), 'X-CSRFToken': window.getCSRFToken() };
            }
            return originalFetch(resource, options);
        };
    })();

    function togglePassword(inputId) {
        const input = document.getElementById(inputId);
        if (input.type === "password") {
            input.type = "text";
        } else {
            input.type = "password";
        }
    }
</script>

</body>
</html>
