<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Redefinir Senha - Arte Fora da Caixa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <style>
        body { justify-content: center; align-items: center; }
        .content-wrapper { width: 100%; max-width: 550px; padding: 20px; }
        .error-message {
            background: #fff0f0; color: var(--red); padding: 12px 16px;
            border-radius: var(--radius-sm); font-size: 13px; font-weight: 600;
            margin-bottom: 20px; text-align: center; border: 1px solid rgba(230, 57, 70, 0.15);
        }

        /* ── Modificações Olhinho de Senha ── */
        .password-container {
            position: relative;
            display: flex;
            align-items: center;
        }
        .toggle-password {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 14px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="content-wrapper">
        <div class="panel-box" style="margin: 0;">
            <h2 class="text-center" style="margin-bottom: 12px;">Nova Senha</h2>
            <p class="text-center" style="color: var(--text-muted); font-size: 14px; margin-bottom: 24px;">
                Crie uma senha forte contendo no mínimo 8 caracteres, com letras maiúsculas, minúsculas e números.
            </p>

            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    {% for message in messages %}
                        <div class="error-message">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form action="{{ url_for('forgot_password.reset_password') }}" method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-field">
                    <label class="form-label">Nova Senha</label>
                    <div class="password-container">
                        <input type="password" name="new_password" id="new_password" class="form-input" placeholder="Digite sua nova senha" required>
                        <button type="button" class="toggle-password" onclick="togglePassword('new_password')">👁️</button>
                    </div>
                </div>

                <div class="form-field" style="margin-bottom: 28px;">
                    <label class="form-label">Confirmar Nova Senha</label>
                    <div class="password-container">
                        <input type="password" name="confirm_password" id="confirm_password" class="form-input" placeholder="Repita a senha" required>
                        <button type="button" class="toggle-password" onclick="togglePassword('confirm_password')">👁️</button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg">
                    Salvar Nova Senha
                </button>
            </form>
        </div>
    </div>

    <script>
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
            } else {
                input.type = "password";
            }
        }
    </script>

</body>
</html>
