<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        body {
            background: #f3f4f6;
            font-family: "Segoe UI", Roboto, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }

        form {
            background: white;
            padding: 40px 35px;
            border-radius: 18px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.08);
            text-align: center;
            width: 320px;
        }

        h2 {
            margin-bottom: 25px;
            color: #222;
            font-size: 24px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border-radius: 10px;
            border: 1px solid #ccc;
            background: #fafafa;
            font-size: 14px;
        }

        /* Botões com estilo uniforme */
        button {
            width: 100%;
            padding: 12px 0;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            transition: 0.2s ease-in-out;
            margin-bottom: 12px;
            color: white;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 14px rgba(0,0,0,0.2);
        }

        /* Cores específicas dos botões */
        button[name="method"][value="local"] {
            background: linear-gradient(90deg, #ff7a00, #00c853); /* laranja-verde */
        }

        button.google {
            background: linear-gradient(90deg, #4285F4, #2a66c7); /* azul Google */
        }

        button.new_account {
            background: linear-gradient(90deg, #f39c12, #e67e22); /* tons de laranja */
        }

        .error {
            color: #ff4444;
            margin-bottom: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <form method="POST" action="/login">
        <h2>Login</h2>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <input type="text" name="name" placeholder="Usuário" required>
        <input type="password" name="password" placeholder="Senha" required>

        <button type="submit" name="method" value="local">Entrar</button>
        <button type="submit" name="method" value="google" class="google" formnovalidate>
            Login com Google
        </button>
        <button type="submit" name="new_account" value="new_account" class="new_account" formnovalidate>
            Criar Conta
        </button>
    </form>
</body>
</html>
