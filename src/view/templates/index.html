<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login - Arte Fora da Caixa</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">

    <style>
        /* Ajustes específicos para a página de Login, aproveitando suas variáveis */
        body {
            /* Garante que o conteúdo fique perfeitamente centralizado */
            justify-content: center;
            align-items: center;
        }
        
        .login-wrapper {
            width: 100%;
            /* Aumentado para 550px para igualar à tela de Criar Conta */
            max-width: 550px; 
            padding: 20px;
        }

        .error-message {
            background: #fff0f0;
            color: var(--red);
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid rgba(230, 57, 70, 0.15);
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-light);
        }

        .divider::before { margin-right: 12px; }
        .divider::after { margin-left: 12px; }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="panel-box" style="margin: 0;">
            <h2 class="text-center" style="margin-bottom: 24px;">Acesso ao Sistema</h2>

            {% if error %}
                <div class="error-message">{{ error }}</div>
            {% endif %}

            <form method="POST" action="/login">
                <div class="form-field">
                    <label class="form-label">Usuário</label>
                    <input type="text" name="name" class="form-input" placeholder="Digite seu usuário" required>
                </div>

                <div class="form-field" style="margin-bottom: 28px;">
                    <label class="form-label">Senha</label>
                    <input type="password" name="password" class="form-input" placeholder="Digite sua senha" required>
                </div>

                <button type="submit" name="method" value="local" class="btn btn-primary btn-block btn-lg" style="margin-bottom: 12px;">
                    Entrar
                </button>
                
                <button type="submit" name="method" value="google" class="btn btn-blue btn-block btn-lg" formnovalidate>
                    Login com Google
                </button>

                <div class="divider">ou</div>

                <button type="submit" name="new_account" value="new_account" class="btn btn-outline btn-block btn-lg" formnovalidate>
                    Criar Nova Conta
                </button>
            </form>
        </div>
    </div>

</body>
</html>
